<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Фон страницы */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: url('/static/images/coffee_background.jpg') center/cover no-repeat;
            font-family: 'Poppins', sans-serif;
            color: #6a4f23;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Карточка редактирования профиля */
        .edit-profile-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 600px;
            padding: 20px;
            overflow: hidden;
        }

        .edit-profile-card h1 {
            text-align: center;
            color: #5a3803;
            margin-bottom: 20px;
        }

        .form-group label {
            font-weight: bold;
            color: #5a3803;
        }

        .form-group textarea,
        .form-group input {
            margin-top: 5px;
        }

        .btn-save {
            background: #8b5e34;
            color: white;
            border: none;
        }

        .btn-save:hover {
            background: #6a4f23;
        }
    </style>
</head>
<body>
    <div class="edit-profile-card">
        <h1>Edit Profile</h1>
        <form action="/edit_profile" method="post">
            <!-- Поле "Обзор" -->
            <div class="form-group mb-3">
                <label for="overview">Overview</label>
                <textarea 
                    id="overview" 
                    name="edit_overview" 
                    class="form-control" 
                    rows="3">{{ info.overview }}</textarea>
            </div>
        
            <!-- Кнопка "Сохранить" -->
            <button type="submit" class="btn btn-save w-100">Save Changes</button>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
